[project]
name = "eltex-ansible"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leonid", email = "penguin.ognev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ansible>=14.3.0",
    "ansible-pylibssh>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.1.0",
    "requests>=2.34.2",
]

[project.scripts]
eltex-ansible = "eltex_ansible:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
