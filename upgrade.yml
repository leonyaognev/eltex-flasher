---
- name: Upgrade Eltex firmware
  hosts: eltex_ph5
  gather_facts: false

  tasks:
    - name: Download new image
      ansible.netcommon.cli_command:
        command: "boot system {{ tftp_link }}"
        prompt:
          - "bytes copied in"
          - "Copy: "
          - "#"
        answer:
          - ""
          - ""
          - ""
      ignore_errors: true

    - name: Reload switch
      ansible.netcommon.cli_command:
        command: reload
        prompt:
          - "Are you sure you want to continue"
          - "Do you want to continue"
          - "SYSTEM RESET"
        answer:
          - "Y"
          - "Y"
          - ""
        check_all: true
