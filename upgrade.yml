---
- name: Upgrade Eltex firmware
  hosts: eltex_ph5
  gather_facts: false

  tasks:
    - name: Download new image
      ansible.netcommon.cli_command:
        command: "boot system tftp://10.178.1.7/403005"

    - name: Reload switch
      ansible.netcommon.cli_command:
        command: reload
        prompt:
          - "Do you want to continue"
        answer:
          - "Y"
